<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: lightgray;
            width: 30%;
        }

        img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        #error {
            color: red;
            margin-top: 10px;
        }
    </style>

    <script>

        function getIdFromURL() {
            let params = new URLSearchParams(window.location.search);
            return params.get("id");  // URL se ?id=5 padega
        }

        function displayProduct(product) {
            let str = `
                <table>
                    <tr><th>ID</th><td>${product.id}</td></tr>
                    <tr><th>Title</th><td>${product.title}</td></tr>
                    <tr><th>Category</th><td>${product.category}</td></tr>
                    <tr><th>Price</th><td>$${product.price}</td></tr>
                    <tr><th>Rating</th><td>${product.rating}</td></tr>
                    <tr><th>Stock</th><td>${product.stock}</td></tr>
                    <tr><th>Description</th><td>${product.description}</td></tr>
                    <tr><th>Image</th><td><img src="${product.thumbnail}" alt="product image"></td></tr>
                </table>
            `;
            document.getElementById("showData").innerHTML = str;
            document.getElementById("error").innerHTML = "";
        }

        async function showDetails() {
            let id = getIdFromURL();

            if (!id) {
                document.getElementById("error").innerHTML = "URL mein ?id=<number> daalo. Example: index.html?id=5";
                return;
            }

            try {
                let response = await axios.get(`https://dummyjson.com/products/1`);
                displayProduct(response.data);
            }
            catch (error) {
                document.getElementById("error").innerHTML = `Product nahi mila ID: ${id}. Valid ID 1-100 honi chahiye.`;
                document.getElementById("showData").innerHTML = "";
            }
        }

    </script>
</head>

<body>

    <h2>Product Details</h2>
    <p>URL mein ID daalo: <code>?id=5</code></p>

    <button onclick="showDetails()">Show Details</button>

    <div id="error"></div>
    <div id="showData"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Swap Task</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body>

    <div class="container">
        <!-- Main Image -->
        <div class="main-image">
            <img id="mainImg" src="imges/download.jpeg" alt="Main Image">
        </div>

        <!-- Thumbnail Images -->
        <div class="thumbnails">
            <img class="thumb" src="imges/download (1).jpeg" alt="img1">
            <img class="thumb" src="imges/download (2).jpeg" alt="img2">
            <img class="thumb" src="imges/download (3).jpeg" alt="img3">
            <img class="thumb" src="imges/download (4).jpeg" alt="img4">
            <img class="thumb" src="imges/IMG-20250504-WA0011-2-scaled.jpg" alt="img5">
        </div>
    </div>
</body>
</html>
